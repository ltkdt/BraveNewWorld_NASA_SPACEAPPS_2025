{% load static %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Demo</title>
    <link rel="stylesheet" href="{% static '/bootstrap/css/bootstrap.min.css' %}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      body { padding: 1.5rem; }
      #chat-messages { max-height: 60vh; overflow: auto; background: #f8f9fa; padding: 12px; border-radius: 6px; }
      .chat-row { gap: 0.5rem; }
      .preload-img { max-width: 240px; max-height: 180px; object-fit: contain; border-radius: 6px; border: 1px solid #e9ecef; }
    </style>
</head>
<body>
    <div class="container p-0" style="max-width:960px;">
      <div class="chat-wrapper d-flex flex-column" style="height:calc(100vh - 3rem); padding:1rem;">
        <header>
          <h1 class="mb-2">Chatbot Helper</h1>
        </header>

        {% if preload_image %}
          <div class="mb-2">
            <label class="form-label">Ask our chatbot about this image:</label>
            <div>
              <img id="preloadImage" src="{{ preload_image }}" alt="Preloaded" class="preload-img">
            </div>
          </div>
        {% endif %}

        <!-- messages area grows to fill available space; remains tall even when empty -->
        <main id="chat-container" class="d-flex flex-column flex-grow-1">
          <div id="chat-messages" class="mb-3 flex-grow-1" style="min-height:45vh; overflow:auto; background:#f8f9fa; padding:12px; border-radius:6px;"></div>

          <!-- input area pinned to bottom of the wrapper -->
          <div class="mt-3">
            <div class="row gx-2 align-items-center">
              <div class="col">
                <input type="text" id="user-input" class="form-control" placeholder="Type your message...">
              </div>
              <div class="col-auto">
                <button id="send-btn" class="btn btn-primary">Send</button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script>
        // CSRF helper (standard Django cookie method)
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        function appendMessage(who, text) {
            $('#chat-messages').append('<p><strong>' + who + ':</strong> ' + text + '</p>');
            // scroll to bottom
            const el = document.getElementById('chat-messages');
            el.scrollTop = el.scrollHeight;
        }

        function sendMessage() {
            var userInput = $('#user-input').val();
            if (userInput.trim() !== '') {
                appendMessage('You', userInput);
                $('#user-input').val('');

                // build payload; include preload image if present
                const payload = { 'message': userInput };
                const preload = document.getElementById('preloadImage');
                if (preload && preload.src) {
                    payload['image'] = preload.src;
                }

                $.ajax({
                    url: '{% url "chat" %}',
                    type: 'POST',
                    data: JSON.stringify(payload),
                    contentType: 'application/json',
                    beforeSend: function(xhr) { xhr.setRequestHeader('X-CSRFToken', csrftoken); },
                    success: function(response) {
                        appendMessage('AI', response.message || '[no reply]');
                    },
                    error: function(xhr, status, err) {
                        appendMessage('System', 'Error: ' + (xhr.responseText || status));
                    }
                });
            }
        }

        // wire events
        $(document).ready(function() {
            $('#send-btn').on('click', sendMessage);
            $('#user-input').keypress(function(e) { if (e.which == 13) sendMessage(); });
        });
    </script>
</body>
</html>
